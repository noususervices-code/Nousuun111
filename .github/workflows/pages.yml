name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate curated content
        run: |
          python scripts/validate_content_quality.py data/events.json data/companies.json
          python scripts/validate_platform_scope.py

      - name: Test event adapter
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build public platform
        run: python scripts/build_static_site.py

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
