name: Validate curated news
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/news.json'
      - 'scripts/validate_content_quality.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_content_quality.py data/news.json
